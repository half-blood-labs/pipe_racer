# Pipe Racer on Fly.io: one small machine that sleeps when nobody is racing.
# Race rooms live in memory, so this must stay a single machine
# (deploy with --ha=false).

app = "pipe-racer"
primary_region = "fra"
kill_signal = "SIGTERM"

[build]

[env]
  PHX_HOST = "pipe-racer.fly.dev"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
